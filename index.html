const tk=t=>[t.date,t.type,c2(t.amount),nm(t.desc)].join('|');let tb=bag(d.tx,tk);
inc.tx.forEach(t=>{let n={...t,id:nid()};if(n.cat)n.cat=own(cM,n.cat)?cM[n.cat]:n.cat;['acct','from','to'].forEach(k=>{if(n[k])n[k]=A(n[k])});if(take(tb,tk(n))){st.txDup++;return}if(n.gid)n.gid=gM[n.gid]||(gM[n.gid]=nid());tM[t.id]=n.id;d.tx.push(n);st.tx++});

Object.keys(inc.plans||{}).forEach(k=>{if(!d.plans[k]&&inc.plans[k]&&typeof inc.plans[k]==='object'){d.plans[k]={...inc.plans[k]};st.plans++}});
Object.keys(inc.snaps||{}).forEach(k=>{if(!d.snaps[k])d.snaps[k]=inc.snaps[k]});
(inc.prefs.invTags||[]).forEach(t=>{let e=d.prefs.invTags.find(x=>x.id===t.id||nm(x.n)===nm(t.n));if(!e){e={...t};d.prefs.invTags.push(e)}tgM[t.id]=e.id});

function syText(){let m=SM();if(!SU)return'Não conectado';if(SY.st==='sync')return'Sincronizando…';if(SY.st==='err')return'Não consegui sincronizar ('+esc(SY.err)+'). Tento de novo sozinho.';if(m.dirty)return'Alterações aguardando envio';return SY.at?'Sincronizado às '+hm(SY.at):'Conectado'}
function syncUI(){let b=$('#syb');if(b){if(!sb){b.hidden=true}else{b.hidden=false;let m=SM();b.className='syb '+(!SU?'':SY.st==='err'?'err':SY.st==='sync'||m.dirty?'':'ok');b.innerHTML=!SU?'☁<span class="syl"> Entrar</span>':SY.st==='sync'?'<span class="spin">↻</span><span class="syl"> Sincronizando</span>':SY.st==='err'?'⚠<span class="syl"> Sem sincronizar</span>':m.dirty?'☁<span class="syl"> Enviando…</span>':'☁<span class="syl"> Salvo</span>';b.setAttribute('aria-label','Sincronização: '+syText().replace(/<[^>]+>/g,''))}}let t=$('#syst');if(t){t.innerHTML=syText();t.className=SY.st==='err'?'rd':''}}
function syncCard(){let h='<div class="card"><h2>Conta e sincronização</h2>';if(!sb)return h+'<small>Não consegui falar com o servidor agora (sem internet?). Os dados ficam salvos neste aparelho. Abra o app de novo com internet para entrar na conta.</small></div>';
if(!SU)return h+'<small>Você está usando o app só neste aparelho. Entre na sua conta para guardar tudo na nuvem e usar no celular e no computador.</small><button class="add" onclick="authShow()">Entrar ou criar conta</button></div>';
return h+`<div class="row"><span>Conta</span><b>${esc(SU.email||'')}</b></div><div class="row"><span>Situação</span><b id="syst">${syText()}</b></div><button class="add" onclick="syncCheck()">↻ Sincronizar agora</button><button class="add" onclick="authOut()">Sair da conta</button></div>`}
function authShow(){if(!sb)return;let d=$('#auth');if(!d){d=document.createElement('div');d.id='auth';d.className='auth';document.body.appendChild(d)}
d.innerHTML=`<div class="bx" role="dialog" aria-labelledby="aut"><h1 id="aut">Meu Financeiro</h1><p>Entre para guardar seus dados na nuvem e usar no celular e no computador.</p>
<label for="aue">E-mail</label><input id="aue" type="email" autocomplete="username" inputmode="email" autocapitalize="off">
<label for="aup">Senha</label><input id="aup" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')authGo('in')">
<button class="b1" onclick="authGo('in')">Entrar</button><button class="b2" onclick="authGo('up')">Criar conta</button>
<div id="aum" class="msg" role="status" aria-live="polite"></div>
<button class="lk" onclick="authGo('reset')">Esqueci a senha</button><button class="lk" onclick="authLocal()">Usar sem conta, só neste aparelho</button></div>`;d.hidden=false;setTimeout(()=>{let e=$('#aue');if(e)e.focus()},50)}
function authHide(){let d=$('#auth');if(d)d.remove()}
function authLocal(){try{localStorage.setItem('mf_local','1')}catch(e){}authHide();syncUI()}
function authErr(x){let m=(x&&x.message)||String(x);if(/invalid login/i.test(m))return'E-mail ou senha incorretos.';if(/not confirmed/i.test(m))return'Confirme seu e-mail antes de entrar. Procure a mensagem do Supabase na caixa de entrada (ou no spam).';if(/already registered|already exists/i.test(m))return'Este e-mail já tem conta. Use Entrar.';if(/at least 6|password should/i.test(m))return'A senha precisa ter pelo menos 6 caracteres.';if(/rate limit|too many/i.test(m))return'Muitas tentativas seguidas. Espere alguns minutos e tente de novo.';if(/fetch|network/i.test(m))return'Sem conexão com a internet.';return'Não deu certo: '+m}
async function authGo(mode){let e=($('#aue').value||'').trim(),p=$('#aup').value||'',g=$('#aum'),say=(t,er)=>{g.textContent=t;g.className='msg'+(er?' e':'')};
if(!e||(mode!=='reset'&&!p))return say(mode==='reset'?'Digite seu e-mail para eu enviar o link.':'Preencha e-mail e senha.',1);say('Aguarde…');
let back=location.protocol.startsWith('http')?location.origin+location.pathname:undefined;
try{let r;if(mode==='in')r=await sb.auth.signInWithPassword({email:e,password:p});else if(mode==='up')r=await sb.auth.signUp({email:e,password:p,options:{emailRedirectTo:back}});else r=await sb.auth.resetPasswordForEmail(e,{redirectTo:back});if(r.error)throw r.error;
if(mode==='up'&&!(r.data&&r.data.session))say('Conta criada. Abra o e-mail de confirmação que o Supabase enviou, toque no link e depois volte aqui para entrar.');else if(mode==='reset')say('Se esse e-mail tiver conta, chega um link para trocar a senha.');else say('')}catch(x){say(authErr(x),1)}}
async function authOut(){ask(['Sair da conta?','Os dados continuam neste aparelho e na nuvem. Para voltar a sincronizar, é só entrar de novo.'],async()=>{if(SM().dirty)await syncPush();await sb.auth.signOut();SU=null;SMset({uid:'',at:'',dirty:0});authShow();render();syncUI()},'Sair',0)}
async function authInit(){if(!sb){syncUI();return}try{let r=await sb.auth.getSession();SU=r.data&&r.data.session?r.data.session.user:null}catch(e){}
sb.auth.onAuthStateChange((ev,ses)=>{if(ev==='PASSWORD_RECOVERY')setTimeout(()=>{let p=prompt('Digite a nova senha (mínimo 6 caracteres):');if(p)sb.auth.updateUser({password:p}).then(r=>alert(r.error?authErr(r.error):'Senha alterada.'))},300);
let u=ses?ses.user:null;if((u&&u.id)!==(SU&&SU.id)){SU=u;if(SU){authHide();try{localStorage.removeItem('mf_local')}catch(e){}setTimeout(syncCheck,0)}if(page==='more')render()}syncUI()});
if(SU)syncCheck();else{let lo=false;try{lo=!!localStorage.getItem('mf_local')}catch(e){}if(!lo)authShow()}syncUI()}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&SU)syncCheck();else if(document.visibilityState==='hidden'&&SU&&SM().dirty)syncPush()});
window.addEventListener('online',()=>{if(SU)syncCheck()});
function applyTheme(){let t=(db.prefs||{}).theme||'auto';if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}
function replaceDb(n,msg){try{localStorage.setItem('mf_prev',JSON.stringify(db))}catch(e){}let sk=n._skip||0;delete n._skip;db=n;let d=new Date();cur=new Date(d.getFullYear(),d.getMonth(),1);sel=iso(d);HY=null;save();applyTheme();
ask(['Pronto!',(msg||'Os dados foram substituídos.')+(sk?` ${sk} despesa(s) com valor zero foram ignoradas.`:'')+' A versão anterior ficou guardada: dá para desfazer em Configurações → Backup.'],()=>{},'OK',1)}
applyTheme();render();
setInterval(()=>{if(document.visibilityState==='visible'&&IC().auto&&['wealth','home'].includes(page)&&!$('#modal').classList.contains('open'))qRefresh()},60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&IC().auto&&Date.now()-QS.at>60000)qRefresh()});
authInit();
</script></body></html>
